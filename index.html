<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模块依赖分析器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>模块依赖分析器</h1>
  <p class="sub">左侧粘贴依赖清单（或拖入 .txt 文件），点击「分析」。被依赖的模块在上层，依赖别人的在下层。</p>
</header>
<main>
  <section id="input-panel">
    <div class="toolbar">
      <button id="btn-analyze" class="primary">分析</button>
      <button id="btn-sample">填入示例</button>
      <button id="btn-selftest">运行自测</button>
      <button id="btn-clear">清空</button>
    </div>
    <textarea id="input" spellcheck="false"
      placeholder="每行一条依赖，例如：&#10;app -&gt; router&#10;app -&gt; store&#10;router -&gt; api&#10;&#10;支持写法：a -&gt; b、a: b、a =&gt; b、b &lt;- a、a -&gt; b, c（逗号多目标）、a -&gt; b -&gt; c（链式）&#10;支持 # 和 // 注释、&quot;引号模块名&quot;、单行模块名（孤立模块）"></textarea>
    <div id="drop-hint">可将 .txt 文件拖入文本框</div>
    <div id="selftest-panel" class="hidden">
      <h2>自测结果</h2>
      <div id="selftest-summary"></div>
      <ul id="selftest-list"></ul>
    </div>
  </section>
  <section id="output-panel">
    <div id="stats">等待分析…</div>
    <div id="graph-wrap">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="graph-hint">点击模块：高亮它的传递上游（谁会牵连它，橙色）与传递下游（它会牵连谁，绿色）。滚轮缩放，拖拽平移，点击空白处清除高亮。</div>
    </div>
    <div class="lists">
      <div id="cycles-panel">
        <h2>环 <span id="cycle-count"></span></h2>
        <div id="cycle-filter" class="hidden"></div>
        <ol id="cycle-list"></ol>
      </div>
      <div id="topo-panel">
        <h2>拓扑顺序（构建 / 阅读顺序）</h2>
        <ol id="topo-list"></ol>
      </div>
      <div id="isolated-panel">
        <h2>孤立模块</h2>
        <ul id="isolated-list"></ul>
      </div>
    </div>
  </section>
</main>
<script src="js/parser.js"></script>
<script src="js/graph.js"></script>
<script src="js/layout.js"></script>
<script src="js/render.js"></script>
<script src="js/selftest.js"></script>
<script src="js/app.js"></script>
</body>
</html>
